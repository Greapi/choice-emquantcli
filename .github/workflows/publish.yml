name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify_release_tag:
    name: Verify release tag and version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python scripts/validate_release_tag.py --tag "$TAG_NAME"

  test:
    needs: verify_release_tag
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Build package
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emq-cli/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

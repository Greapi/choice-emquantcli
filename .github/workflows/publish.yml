name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify_release_tag:
    name: Verify release tag and version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python scripts/validate_release_tag.py --tag "$TAG_NAME"

  test:
    needs: verify_release_tag
    uses: ./.github/workflows/ci.yml

  build:
    name: Build wheel (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Build wheel
        run: uv build --wheel
        shell: bash

      - name: Retag wheel for target platform
        run: |
          set -eux
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m wheel tags --platform-tag linux_x86_64 --remove dist/*.whl
          elif [ "${{ runner.os }}" = "macOS" ]; then
            python -m wheel tags --platform-tag macosx_11_0_universal2 --remove dist/*.whl
          elif [ "${{ runner.os }}" = "Windows" ]; then
            python -m wheel tags --platform-tag win_amd64 --remove dist/*.whl
          else
            echo "Unsupported runner OS: ${{ runner.os }}"
            exit 1
          fi
        shell: bash

      - name: Keep wheel artifacts only
        run: rm -f dist/*.tar.gz
        shell: bash

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emq-cli/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

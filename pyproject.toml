[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "emq-cli"
version = "0.2.4"
description = "EMQ CLI with vendored EmQuantAPI integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "emq-cli contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "typer>=0.16.0,<1.0.0",
]

[project.scripts]
emq = "emq.cli:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.8.0,<8.0.0",
  "mypy>=1.15.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.11.0,<0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["EMQuantAPI_Python", "src/emq/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
exclude = "(^src/emq/vendor/|^EMQuantAPI_Python/)"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/emq"]
[tool.hatch.build]
include = [
  "src/emq/**",
  "README.md",
  "ARCHITECHTURE.md",
  "docs/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/emq",
  "tests",
  "README.md",
  "ARCHITECHTURE.md",
  "docs",
]
